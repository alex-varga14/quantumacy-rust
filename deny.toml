# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
# CI gate for licenses, advisories, duplicate versions, and registry sources.

[graph]
all-features = true

[advisories]
# Vulnerabilities fail the build. Warnings (unmaintained, unsound) are
# surfaced but individually triaged here.
ignore = [
    # rustls-pemfile is unmaintained upstream of tonic 0.12; replaced when
    # the tonic stack next moves. Tracked in SECURITY_ROADMAP.md WS6.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate versions bloat builds and widen the audit surface; warn for now,
# tighten to "deny" once the tonic ecosystem converges.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without versions; that's the
# normal pattern for an unpublished workspace, not a wildcard hazard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
