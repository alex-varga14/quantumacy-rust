[workspace]
members = [
    "qkd-core",
    "qkd-network",
    "fedlearn-core",
    "fedlearn-transport",
    "he-core",
    "he-inference",
    "dl-models",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alex Varga <alexanderv1414@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/alex-varga14/quantumacy-rust"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tonic-build = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
rand = "0.9"
rand_chacha = "0.3"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
hkdf = "0.12"
x509-parser = "0.16"
rcgen = "0.13"
zeroize = { version = "1", features = ["derive"] }

# ML (Candle) - Phase 5
# candle-core = "0.8"
# candle-nn = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
parking_lot = "0.12"
dashmap = "5"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
